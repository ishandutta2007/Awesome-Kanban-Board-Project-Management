<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .col-header {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #cbd5e1;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #f1f5f9;
      }
      .card-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 11px;
        fill: #94a3b8;
      }

      /* Dynamic Animated Cards Flowing Across Kanban Lanes */
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.05); }
      }
      @keyframes shiftFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-1 { animation: floatCard1 4s ease-in-out infinite; }
      .floating-2 { animation: floatCard2 5s ease-in-out infinite 0.8s; }
      .floating-3 { animation: floatCard3 4.5s ease-in-out infinite 1.6s; }
      .pulse-ambient { animation: pulseGlow 6s ease-in-out infinite alternate; transform-origin: center; }
      .flow-line { stroke-dasharray: 6 6; animation: shiftFlow 2s linear infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="200" cy="100" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)" class="pulse-ambient" />
  <circle cx="950" cy="220" r="180" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" class="pulse-ambient" />
  <circle cx="600" cy="380" r="120" fill="#ec4899" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)" />

  <!-- ================= FOREGROUND HERO CONTENT (Top Left) ================= -->
  <!-- Tag / Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="badge-text" fill="#60a5fa">AGILE WORKFLOW ECOSYSTEM</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="125" class="title">Awesome Kanban Board</text>
  <text x="60" y="172" class="title" fill="#a855f7" style="fill: url(#accentGrad);">Project Management</text>
  <text x="60" y="215" class="subtitle">Curated visual task boards, open-source engines &amp; agile workflow platforms</text>

  <!-- Feature Metric Pills -->
  <g transform="translate(60, 248)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" class="badge-text" fill="#38bdf8">⚡ Visual Boards</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(142, 0)">
      <rect width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" class="badge-text" fill="#a78bfa">🔒 Self-Hosted FOSS</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(309, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" class="badge-text" fill="#f472b6">📊 WIP Limits</text>
    </g>
  </g>

  <!-- Dynamic Connecting Flow Curve Between Hero and Kanban Canvas -->
  <path d="M 455 265 C 530 265, 540 210, 610 210" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6" class="flow-line" />

  <!-- ================= DYNAMIC KANBAN BOARD PREVIEW (Right Side) ================= -->
  <!-- Kanban Board Container -->
  <g transform="translate(630, 45)" filter="url(#shadow)">
    <!-- Board Frame -->
    <rect width="520" height="330" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.95" />

    <!-- 3 Board Columns -->
    <!-- Column 1: Backlog / To Do -->
    <g transform="translate(16, 16)">
      <rect width="155" height="298" rx="10" fill="url(#columnGrad)" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#3b82f6" />
      <text x="28" y="22" class="col-header">BACKLOG (4)</text>
      
      <!-- Card 1 in Col 1 -->
      <g transform="translate(8, 36)">
        <rect width="139" height="74" rx="8" fill="url(#cardGrad1)" stroke="#2563eb" stroke-width="1" />
        <rect x="12" y="12" width="46" height="14" rx="4" fill="#3b82f6" opacity="0.3" />
        <text x="16" y="23" font-size="9" fill="#93c5fd" font-family="sans-serif" font-weight="700">SPRINT</text>
        <text x="12" y="44" class="card-title">Setup CI/CD</text>
        <text x="12" y="60" class="card-sub">#infra • 3 tasks</text>
      </g>

      <!-- Card 2 in Col 1 (Static) -->
      <g transform="translate(8, 120)">
        <rect width="139" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8" />
        <text x="12" y="28" class="card-title">OAuth SSO</text>
        <text x="12" y="48" class="card-sub">Nextcloud / OIDC</text>
      </g>
    </g>

    <!-- Column 2: In Progress (Features Dynamic Floating / Moving Card) -->
    <g transform="translate(182, 16)">
      <rect width="155" height="298" rx="10" fill="url(#columnGrad)" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#8b5cf6">
        <animate attributeName="fill" values="#8b5cf6;#ec4899;#8b5cf6" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="22" class="col-header">IN PROGRESS (2)</text>

      <!-- Dynamic Animated Floating Card in WIP Lane -->
      <g transform="translate(8, 36)" class="floating-1">
        <rect width="139" height="96" rx="8" fill="url(#cardGrad2)" stroke="#8b5cf6" stroke-width="1.4" filter="url(#glow)" opacity="0.95" />
        <rect x="12" y="10" width="56" height="15" rx="4" fill="#8b5cf6" opacity="0.35" />
        <text x="16" y="21" font-size="9" fill="#c4b5fd" font-family="sans-serif" font-weight="700">WIP LIMIT: 3</text>
        <text x="12" y="44" class="card-title">Live Kanban Sync</text>
        <text x="12" y="60" class="card-sub">WebSockets engine</text>
        <!-- Progress Bar Indicator -->
        <rect x="12" y="74" width="115" height="5" rx="2.5" fill="#334155" />
        <rect x="12" y="74" width="82" height="5" rx="2.5" fill="#a855f7">
          <animate attributeName="width" values="40;95;40" dur="4s" repeatCount="indefinite" />
        </rect>
      </g>

      <!-- Second Card in Col 2 -->
      <g transform="translate(8, 146)" class="floating-3">
        <rect width="139" height="74" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.85" />
        <text x="12" y="28" class="card-title">Gantt Timeline</text>
        <text x="12" y="46" class="card-sub">Dependencies solver</text>
      </g>
    </g>

    <!-- Column 3: Done (Features Animated Finished Pulse Card) -->
    <g transform="translate(348, 16)">
      <rect width="155" height="298" rx="10" fill="url(#columnGrad)" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#10b981" />
      <text x="28" y="22" class="col-header">DONE (8)</text>

      <!-- Dynamic Card in Done -->
      <g transform="translate(8, 36)" class="floating-2">
        <rect width="139" height="80" rx="8" fill="url(#cardGrad3)" stroke="#10b981" stroke-width="1.2" />
        <rect x="12" y="10" width="52" height="15" rx="4" fill="#10b981" opacity="0.3" />
        <text x="16" y="21" font-size="9" fill="#6ee7b7" font-family="sans-serif" font-weight="700">SHIPPED</text>
        <text x="12" y="44" class="card-title">Self-Host Docker</text>
        <text x="12" y="62" class="card-sub">✓ 1-click compose</text>
      </g>

      <!-- Finished Card 2 -->
      <g transform="translate(8, 126)">
        <rect width="139" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.7" />
        <text x="12" y="28" class="card-title">Database Importer</text>
        <text x="12" y="46" class="card-sub">✓ Trello, Jira, Asana</text>
      </g>
    </g>
  </g>
</svg>
